        const STATE_KEY = 'JELAS_APP_STATE_V7';
        
        function loadState() {
            const saved = localStorage.getItem(STATE_KEY);
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    // Migrasi penambahan struktur baru
                    if(!parsed.documentFormat) parsed.documentFormat = DEFAULT_STATE.documentFormat;
                    if(!parsed.appConfig) {
                        parsed.appConfig = DEFAULT_STATE.appConfig;
                        if(parsed.institution.appLogo) parsed.appConfig.appLogo = parsed.institution.appLogo;
                        if(parsed.institution.appTitle) parsed.appConfig.appTitle = parsed.institution.appTitle;
                        if(parsed.institution.appSubTitle) parsed.appConfig.appSubTitle = parsed.institution.appSubTitle;
                    }
                    if(parsed.documentFormat.logoKiri === undefined) {
                        parsed.documentFormat.logoKiri = parsed.institution.logo || DEFAULT_STATE.documentFormat.logoKiri;
                        parsed.documentFormat.logoKanan = DEFAULT_STATE.documentFormat.logoKanan;
                    }
                    return parsed;
                } catch (e) { console.error('Gagal parse state'); }
            }
            saveState(DEFAULT_STATE);
            return DEFAULT_STATE;
        }

        function saveState(stateObj) { localStorage.setItem(STATE_KEY, JSON.stringify(stateObj)); }
        
        let appState = loadState();

        function updateState(updaterFn) {
            updaterFn(appState);
            saveState(appState);
            renderApp();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-accent-600');
            const iconClass = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle');

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white shadow-xl ${bgClass} transform transition-all duration-300 translate-y-4 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${iconClass} text-lg"></i><span class="text-sm font-medium flex-1">${message}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white transition-colors"><i class="fa-solid fa-xmark"></i></button>`;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function openModalHtml(htmlContent) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            container.classList.remove('hidden');
            requestAnimationFrame(() => { 
                content.classList.remove('scale-95', 'opacity-0'); 
                content.classList.add('scale-100', 'opacity-100'); 
            });
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { container.classList.add('hidden'); content.innerHTML = ''; }, 300);
        }

        // Fungsi kompresi gambar agar tidak memenuhi LocalStorage
        function compressImage(file, maxSize, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/png'));
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function exportToWord(elementId, filename) {
            let clone = document.getElementById(elementId).cloneNode(true);
            let buttons = clone.querySelectorAll('button');
            buttons.forEach(b => b.remove());
            let printElements = clone.querySelectorAll('.print-only');
            printElements.forEach(h => {
                h.classList.remove('print-only', 'hidden');
                h.style.display = 'block';
            });

            let sourceHTML = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export Document</title></head><body>";
            sourceHTML += clone.innerHTML;
            sourceHTML += "</body></html>";
            
            let source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            let fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = filename + '.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
            showToast('Dokumen berhasil diekspor ke Word.', 'success');
        }

        function attachLoginEvents() {
            document.getElementById('login-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const role = document.getElementById('login-role').value;
                const user = document.getElementById('login-username').value.trim();
                const pass = document.getElementById('login-password').value.trim();
                
                const foundUser = appState.users.find(u => u.username === user && u.password === pass && u.active);
                if (foundUser && foundUser.role === role) {
                    updateState(state => { state.currentUser = foundUser; state.activeMenu = 'dashboard'; });
                    showToast(`Selamat datang, ${foundUser.name}!`);
                } else {
                    const errDiv = document.getElementById('login-error');
                    errDiv.classList.remove('hidden');
                    document.getElementById('login-error-msg').innerText = 'Kredensial tidak valid.';
                }
            });
        }

        function renderSidebarMenu() {
            const role = appState.currentUser.role;
            const active = appState.activeMenu;
            const menuGroups = [
                { title: 'Menu Utama', items: [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-house', role: 'all' }, 
                    { id: 'data-kelas', label: 'Data Kelas', icon: 'fa-users-rectangle', role: 'all' }, 
                    { id: 'data-siswa', label: 'Data Siswa', icon: 'fa-user-graduate', role: 'all' }
                ]},
                { title: 'Manajemen Akademik', items: [
                    { id: 'daftar-hadir', label: 'Jurnal Presensi', icon: 'fa-clipboard-user', role: 'all' }, 
                    { id: 'daftar-nilai', label: 'Form Nilai Siswa', icon: 'fa-file-pen', role: 'all' },
                    { id: 'rekap-absen', label: 'Laporan Presensi', icon: 'fa-calendar-check', role: 'all' },
                    { id: 'rekap-nilai', label: 'Cetak Rekap Nilai', icon: 'fa-print', role: 'all' }
                ]},
                { title: 'Konfigurasi Sistem', items: [
                    { id: 'pengaturan-lembaga', label: 'Profil Lembaga', icon: 'fa-building-columns', role: 'admin' },
                    { id: 'pengaturan-dokumen', label: 'Format Dokumen & KOP', icon: 'fa-file-signature', role: 'admin' },
                    { id: 'pengaturan-aplikasi', label: 'Tampilan Aplikasi', icon: 'fa-desktop', role: 'admin' },
                    { id: 'pengaturan-akun', label: 'Kelola Pengguna', icon: 'fa-users-gear', role: 'admin' }
                ]}
            ];

            return menuGroups.map(group => {
                const items = group.items.filter(i => i.role === 'all' || i.role === role);
                if (!items.length) return '';
                
                let html = `<div class="mb-4"><div class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 mb-2">${group.title}</div><div class="space-y-1">`;
                items.forEach(item => {
                    const isActive = active === item.id;
                    const bgClass = isActive ? 'bg-emerald-500/10 text-emerald-400 font-bold' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 font-medium';
                    const iconColor = isActive ? 'text-emerald-400' : 'text-slate-500';
                    html += `<button onclick="updateState(s => s.activeMenu = '${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-all ${bgClass}"><i class="fa-solid ${item.icon} w-6 text-center ${iconColor}"></i><span class="truncate">${item.label}</span></button>`;
                });
                return html + `</div></div>`;
            }).join('');
        }

        function renderTempComponents() {
            const listContainer = document.getElementById('component-builder-list');
            if(!listContainer) return;
            
            listContainer.innerHTML = tempGradeComponents.map((comp, idx) => `
                <div class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl shadow-sm">
                    <div class="w-8 h-8 bg-slate-50 text-slate-400 rounded-lg flex items-center justify-center font-bold text-xs">${idx + 1}</div>
                    <div class="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-2">
                            <input type="text" value="${comp.name}" onchange="updateTempComp('${comp.id}', 'name', this.value)" placeholder="Nama Kolom (Cth: Ulangan Harian)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold outline-none focus:border-emerald-500">
                        </div>
                        <div class="relative">
                            <input type="number" min="0" max="100" value="${comp.weight}" onchange="updateTempComp('${comp.id}', 'weight', this.value)" onkeyup="updateTempComp('${comp.id}', 'weight', this.value)" class="w-full pl-3 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-center outline-none focus:border-emerald-500">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xs">%</span>
                        </div>
                    </div>
                    <button onclick="removeTempComponent('${comp.id}')" class="w-10 h-10 flex items-center justify-center text-rose-400 hover:bg-rose-50 rounded-xl transition-all"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
            updateTotalWeight();
        }

        function addTempComponent() {
            tempGradeComponents.push({ id: 'comp_' + Math.random().toString(36).substr(2, 9), name: 'Penilaian Baru', weight: 0 });
            renderTempComponents();
        }
        function removeTempComponent(id) { tempGradeComponents = tempGradeComponents.filter(c => c.id !== id); renderTempComponents(); }
        function updateTempComp(id, field, value) {
            const comp = tempGradeComponents.find(c => c.id === id);
            if (comp) { field === 'weight' ? (comp.weight = parseInt(value) || 0) : (comp.name = value); updateTotalWeight(); }
        }
        function updateTotalWeight() {
            const total = tempGradeComponents.reduce((sum, c) => sum + c.weight, 0);
            const display = document.getElementById('total-weight-display');
            if(display) {
                display.innerText = `${total}%`;
                display.className = `text-xl font-black ${total === 100 ? 'text-emerald-600' : 'text-rose-600'}`;
            }
            return total;
        }

        function saveGradeComponents() {
            const total = updateTotalWeight();
            const errDiv = document.getElementById('builder-error');
            const errMsg = document.getElementById('builder-error-msg');
            
            if (tempGradeComponents.length === 0) { errMsg.innerText = "Minimal harus ada 1 kolom."; errDiv.classList.remove('hidden'); return; }
            if (total !== 100) { errMsg.innerText = `Total bobot saat ini ${total}%. Harus pas 100%!`; errDiv.classList.remove('hidden'); return; }

            updateState(state => { state.gradeComponents = [...tempGradeComponents]; });
            closeModal();
            showToast('Pengaturan kolom nilai berhasil disimpan.');
            if(!document.getElementById('grades-container').classList.contains('hidden')) loadDynamicGradesTable();
        }

        function loadDynamicGradesTable() {
            const className = document.getElementById('nilai-kelas').value;
            const subject = document.getElementById('nilai-mapel').value;
            const container = document.getElementById('grades-container');
            const students = appState.students.filter(s => s.className === className);
            const comps = appState.gradeComponents;

            let thHtml = comps.map(c => `<th class="p-3 border-x border-slate-100 text-center"><div class="truncate max-w-[100px]" title="${c.name}">${c.name}</div><div class="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.5 rounded inline-block mt-1">${c.weight}%</div></th>`).join('');

            let html = `
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-sm">Form Pengisian Nilai: ${subject} (${className})</h3>
            </div>
            <div class="overflow-x-auto flex-1 custom-scrollbar">
                <table class="w-full text-xs text-slate-700 min-w-[700px]">
                    <thead class="bg-slate-100/50 border-b border-slate-200 uppercase tracking-wider text-[10px] font-bold text-slate-500">
                        <tr><th class="p-3 w-10 text-center">No</th><th class="p-3 text-left">Nama Siswa</th>${thHtml}<th class="p-3 text-emerald-700 bg-emerald-50 w-20 text-center">Akhir</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100" id="dyn-tbody">
            `;

            students.forEach((s, idx) => {
                const rec = appState.grades.find(g => g.studentId === s.id && g.subject === subject && g.className === className) || {scores:{}};
                let total = 0;
                let tdHtml = comps.map(c => {
                    const val = rec.scores[c.id] || 0;
                    total += val * (c.weight / 100);
                    return `<td class="p-2 border-x border-slate-50"><input type="number" value="${val}" data-compid="${c.id}" class="dyn-input w-full p-2 border rounded-lg text-center font-bold text-sm outline-none focus:border-emerald-500" oninput="calcRow(this)"></td>`;
                }).join('');
                
                html += `<tr data-studentid="${s.id}"><td class="p-3 text-center text-slate-400 font-bold">${idx + 1}</td><td class="p-3 font-bold">${s.name}</td>${tdHtml}<td class="p-3 text-center bg-emerald-50"><span class="dyn-final font-black text-base ${total >= 75 ? 'text-emerald-600':'text-rose-600'}">${Math.round(total*10)/10}</span></td></tr>`;
            });

            container.innerHTML = html + `</tbody></table></div>
            <div class="p-5 border-t border-slate-100 bg-slate-50 flex justify-end">
                <button onclick="saveDynamicGrades('${className}', '${subject}')" class="px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg flex items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Simpan Nilai</button>
            </div>`;
            container.classList.remove('hidden'); container.classList.add('flex');
        }

        function calcRow(el) {
            const tr = el.closest('tr');
            let total = 0;
            tr.querySelectorAll('.dyn-input').forEach(inp => {
                const w = appState.gradeComponents.find(c => c.id === inp.dataset.compid).weight;
                total += (parseFloat(inp.value)||0) * (w / 100);
            });
            total = Math.round(total*10)/10;
            const fin = tr.querySelector('.dyn-final');
            fin.innerText = total;
            fin.className = `dyn-final font-black text-base ${total >= 75 ? 'text-emerald-600':'text-rose-600'}`;
        }

        function saveDynamicGrades(className, subject) {
            const rows = document.querySelectorAll('#dyn-tbody tr');
            updateState(state => {
                rows.forEach(r => {
                    let scores = {};
                    r.querySelectorAll('.dyn-input').forEach(inp => scores[inp.dataset.compid] = parseFloat(inp.value)||0);
                    const idx = state.grades.findIndex(g => g.studentId === r.dataset.studentid && g.subject === subject && g.className === className);
                    if (idx > -1) state.grades[idx].scores = scores;
                    else state.grades.push({ id: 'g'+Date.now()+Math.random(), className, subject, studentId: r.dataset.studentid, scores });
                });
            });
            showToast(`Nilai ${subject} kelas ${className} disimpan.`);
        }

        function renderRekapNilaiView() {
            const classOptions = appState.classes.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            return `

                <div class="flex justify-between items-center bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm screen-only">

        function loadRekapNilaiPrint() {
            const clsName = document.getElementById('rn-kelas').value;
            const subject = document.getElementById('rn-mapel').value;
            if(!clsName) return showToast('Pilih kelas terlebih dahulu', 'error');

            document.getElementById('rn-content').classList.add('hidden');
            document.getElementById('rn-actual-content').classList.remove('hidden');
            document.getElementById('rn-lbl-mapel').innerText = subject;
            document.getElementById('rn-lbl-kelas').innerText = clsName;

            const students = appState.students.filter(s => s.className === clsName);
            const comps = appState.gradeComponents;

            let th = comps.map(c => `<th class="p-2 border border-slate-300 bg-slate-100 text-xs text-center">${c.name} (${c.weight}%)</th>`).join('');
            let tbody = students.map((s, i) => {
                const rec = appState.grades.find(g => g.studentId === s.id && g.subject === subject && g.className === clsName) || {scores:{}};
                let tot = 0;
                let td = comps.map(c => {
                    let v = rec.scores[c.id] || 0;
                    tot += v * (c.weight/100);
                    return `<td class="p-2 border border-slate-300 text-center text-xs">${v}</td>`;
                }).join('');
                return `<tr><td class="p-2 border border-slate-300 text-center text-xs">${i+1}</td><td class="p-2 border border-slate-300 text-xs font-bold">${s.name}</td>${td}<td class="p-2 border border-slate-300 text-center font-bold text-xs bg-slate-50">${Math.round(tot*10)/10}</td></tr>`;
            }).join('');

            document.getElementById('rn-table-container').innerHTML = `
                <table class="w-full border-collapse border border-slate-300 mb-6">
                    <thead><tr><th class="p-2 border border-slate-300 bg-slate-100 w-10 text-xs">No</th><th class="p-2 border border-slate-300 bg-slate-100 text-left text-xs">Nama Siswa</th>${th}<th class="p-2 border border-slate-300 bg-slate-100 w-16 text-xs">Akhir</th></tr></thead>
                    <tbody>${tbody}</tbody>
                </table>
            `;

            const clsData = appState.classes.find(c => c.name === clsName);
            const teacher = clsData ? appState.users.find(u => u.teacherId === clsData.homeroomTeacherId) : null;
            document.getElementById('rn-signature').innerHTML = generateSignatureHtml(teacher?.name, teacher?.nip);
        }
